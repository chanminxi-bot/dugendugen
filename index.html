<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>두근두근 미남 공략하기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 한 화면 앱 — 타이틀 화면 / 카톡 대화(헤더·대화·선택지) / 엔딩·도감 오버레이 */
:root {
  --chat-bg: #c9d3e3;
  --header-bg: #bfcadb;
  --bubble-him: #ffffff;
  --bubble-me: #ffe58a;
  --ink: #1f2430;
  --ink-soft: #5b6476;
  --pill: rgba(40, 50, 70, .18);
  --pill-ink: #ffffff;
  --panel: #f6f7fa;
  --choice: #ffffff;
  --choice-line: #d4d9e3;
  --heart: #e8507a;
  --overlay: rgba(20, 24, 34, .55);
  /* 타이틀 화면은 파스텔 단일 테마 */
  --t-pink: #ff6fae;
  --t-pink-deep: #e2458f;
  --t-sky: #6cc4ff;
  --t-purple: #b46cf0;
  --t-btn: rgba(255, 228, 242, .82);
  --t-btn-ink: #d23f86;
  --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "SF Pro Text", "Malgun Gothic", "Noto Sans KR", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --chat-bg: #1e2330; --header-bg: #232938; --bubble-him: #343b4c; --bubble-me: #e9c95c;
    --ink: #eef0f5; --ink-soft: #a3abbd; --pill: rgba(255,255,255,.12); --pill-ink: #dfe3ec;
    --panel: #171b25; --choice: #2a3040; --choice-line: #3b4356; --heart: #ff6f96;
    --overlay: rgba(0,0,0,.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --chat-bg: #1e2330; --header-bg: #232938; --bubble-him: #343b4c; --bubble-me: #e9c95c;
  --ink: #eef0f5; --ink-soft: #a3abbd; --pill: rgba(255,255,255,.12); --pill-ink: #dfe3ec;
  --panel: #171b25; --choice: #2a3040; --choice-line: #3b4356; --heart: #ff6f96;
  --overlay: rgba(0,0,0,.6); color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--chat-bg); color: var(--ink); font-family: var(--font); font-size: 15px; overflow: hidden; }
button { font-family: var(--font); }
.app { height: 100%; display: flex; flex-direction: column; max-width: 520px; margin: 0 auto; background: var(--chat-bg); position: relative; overflow: hidden; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
:focus-visible { outline: 2px solid var(--heart); outline-offset: 2px; }

/* ---- 아바타 (일러스트풍) ---- */
.avatar { width: 40px; height: 40px; border-radius: 15px; flex: none; align-self: flex-start; overflow: hidden; background: linear-gradient(160deg, #a9c8ff, #f3b8d8); }
.avatar svg { width: 100%; height: 100%; display: block; }

/* ---- 대화 화면 ---- */
header { background: var(--header-bg); padding-block: 10px; display: flex; align-items: center; gap: 10px; }
header .name { font-size: 17px; font-weight: 600; flex: 1; min-width: 0; }
.meter { display: flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; font-size: 14px; color: var(--heart); background: var(--bubble-him); border-radius: 999px; padding: 4px 10px; }
.icon-btn { border: 0; background: transparent; color: var(--ink-soft); font-size: 13px; padding: 6px 8px; border-radius: 8px; cursor: pointer; }

#chat { flex: 1; overflow-y: auto; padding-block: 14px 20px; display: flex; flex-direction: column; gap: 6px; }
.day { align-self: center; background: var(--pill); color: var(--pill-ink); font-size: 12px; padding: 4px 12px; border-radius: 999px; margin-block: 8px; }
.narr { align-self: center; text-align: center; color: var(--ink-soft); font-size: 13px; max-width: 80%; margin-block: 6px; line-height: 1.5; }
.row { display: flex; align-items: flex-end; gap: 6px; }
.row.him { padding-left: 46px; }
.row.him.first { padding-left: 0; }
.row.me { justify-content: flex-end; }
.stack { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.sender { font-size: 12px; color: var(--ink); opacity: .85; }
.bubble { padding: 8px 11px; border-radius: 4px 14px 14px 14px; background: var(--bubble-him); color: var(--ink); line-height: 1.45; max-width: min(260px, 70vw); word-break: keep-all; overflow-wrap: anywhere; }
.row.me .bubble { background: var(--bubble-me); color: #2a2410; border-radius: 14px 4px 14px 14px; }
.time { font-size: 10px; color: var(--ink-soft); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pop { animation: pop .22s ease-out; }
@keyframes pop { from { transform: translateY(6px); opacity: .3; } to { transform: none; opacity: 1; } }
.typing .bubble { display: flex; gap: 4px; padding: 12px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-soft); animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%,100% { opacity: .25; } 50% { opacity: 1; } }

#choices { background: var(--panel); padding-block: 12px; display: flex; flex-direction: column; gap: 8px; min-height: 64px; border-top: 1px solid var(--choice-line); }
#choices .hint { font-size: 11px; color: var(--ink-soft); letter-spacing: .04em; }
.choice { text-align: left; font-size: 15px; color: var(--ink); background: var(--choice); border: 1px solid var(--choice-line); border-radius: 12px; padding: 11px 14px; cursor: pointer; line-height: 1.4; }
@media (hover: hover) { .choice:hover { border-color: var(--heart); } }
.choice { -webkit-tap-highlight-color: transparent; }
.choice:focus { outline: none; }
.choice:focus-visible { outline: 2px solid var(--heart); outline-offset: 2px; }
.skip-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.skip-btn { font-size: 13px; color: var(--ink-soft); background: var(--choice); border: 1px solid var(--choice-line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.choice.act { color: var(--ink-soft); }
.choice.act::before { content: "▸ "; }
.waiting { color: var(--ink-soft); font-size: 13px; align-self: center; padding-block: 10px; }
.toast { position: absolute; top: 64px; right: max(16px, env(safe-area-inset-right, 0px)); font-size: 18px; font-weight: 700; color: var(--heart); pointer-events: none; animation: float 1.1s ease-out forwards; }
@keyframes float { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(-24px); } }

/* ---- 오버레이 공통 ---- */
.overlay { position: absolute; inset: 0; display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; }
.dim { background: var(--overlay); }
.card { background: var(--panel); border-radius: 20px; padding: 24px 20px; width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 14px; max-height: 100%; overflow-y: auto; }
.card .label { font-size: 11px; letter-spacing: .12em; color: var(--ink-soft); font-weight: 600; }
.card h2 { margin: 0; font-size: 26px; font-weight: 800; text-wrap: balance; }
.card .score { font-size: 15px; color: var(--heart); font-variant-numeric: tabular-nums; }
.card .tbd { font-size: 13px; color: var(--ink-soft); line-height: 1.5; }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.log li { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed var(--choice-line); padding-bottom: 6px; }
.log li span:first-child { min-width: 0; }
.log li span:last-child { font-variant-numeric: tabular-nums; color: var(--heart); flex: none; }
.btns { display: flex; gap: 8px; }
.btn { flex: 1; font-size: 16px; font-weight: 700; border: 0; border-radius: 12px; padding: 12px; background: var(--bubble-me); color: #2a2410; cursor: pointer; }
.btn.ghost { background: var(--choice); color: var(--ink); border: 1px solid var(--choice-line); }

/* ---- 타이틀 화면 ---- */
#title { z-index: 5; background:
  radial-gradient(ellipse 60% 30% at 80% 15%, rgba(255,255,255,.85), transparent 70%),
  radial-gradient(ellipse 50% 25% at 15% 30%, rgba(255,255,255,.7), transparent 70%),
  linear-gradient(180deg, #a9d6ff 0%, #cfe6ff 40%, #f6dff0 75%, #f4cfe6 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 44px; color-scheme: light; }
#title::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 28%;
  background: linear-gradient(180deg, transparent, rgba(232,214,236,.9)),
  repeating-linear-gradient(90deg, rgba(190,175,210,.55) 0 2px, transparent 2px 38px);
  pointer-events: none; }
#petals { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
.logo { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; line-height: 1; transform: rotate(-4deg); }
.logo .heart { position: absolute; width: 118%; left: -9%; top: -14%; z-index: -1; }
.logo span { font-weight: 900; letter-spacing: -.02em; background-clip: text; -webkit-background-clip: text; color: transparent;
  filter: drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 8px 12px rgba(226,69,143,.3)); }
.logo .l1 { font-size: clamp(52px, 17vw, 84px); background-image: linear-gradient(180deg, #ffc1dd 0%, var(--t-pink) 45%, var(--t-pink-deep) 100%); }
.logo .line2 { display: flex; align-items: baseline; gap: 10px; margin-top: 4px; }
.logo .l2 { font-size: clamp(56px, 19vw, 92px); background-image: linear-gradient(180deg, #d6f0ff 0%, var(--t-sky) 50%, #4f8ff0 100%); }
.logo .l3 { font-size: clamp(32px, 10vw, 50px); background-image: linear-gradient(180deg, #f3d8ff 0%, var(--t-purple) 60%, #8f4cd6 100%); }
.spark { position: absolute; color: #fff; font-size: 22px; text-shadow: 0 0 8px #fff; z-index: 2; }
.menu { position: relative; z-index: 2; display: flex; flex-direction: column; gap: 10px; width: min(260px, 100%); }
.menu button { display: flex; align-items: center; gap: 12px; font-size: 17px; font-weight: 600; color: var(--t-btn-ink); background: var(--t-btn); border: 1.5px solid rgba(255,255,255,.95); border-radius: 12px; padding: 12px 18px; cursor: pointer; box-shadow: 0 4px 14px rgba(226,69,143,.15); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: transform .15s, background .15s; }
.menu button:hover { transform: translateX(4px); background: rgba(255,214,235,.95); }
.menu button::before { content: "♡"; font-size: 18px; }
.menu button:hover::before { content: "♥"; }

/* ---- 엔딩 도감 ---- */
.gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.slot { border-radius: 14px; padding: 14px 12px; display: flex; flex-direction: column; gap: 6px; min-height: 96px; background: var(--choice); border: 1px solid var(--choice-line); min-width: 0; }
.slot b { font-size: 17px; }
.slot small { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.slot.locked b { color: var(--ink-soft); }
.slot.got { border-color: var(--heart); }
.slot .tag { font-size: 11px; color: var(--heart); font-weight: 700; }
.count { font-size: 13px; color: var(--ink-soft); }

/* ---- 엔딩 독백 ---- */
.mono { align-self: center; text-align: center; color: var(--ink); font-size: 14px; line-height: 1.6; max-width: 86%; margin-block: 4px; text-wrap: balance; }
.mono.quote { font-size: 16px; font-weight: 600; color: var(--heart); }

/* ---- 전화 화면 (iOS 느낌, 단일 다크 테마) ---- */
.callscreen { position: absolute; inset: 0; z-index: 6; color-scheme: dark; color: #fff; display: flex; flex-direction: column; align-items: center;
  background: radial-gradient(ellipse 90% 60% at 50% 20%, #5a4a78 0%, #2a2440 55%, #141220 100%);
  padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); padding-block: 56px 40px; }
.call-top { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.call-avatar { width: 96px; height: 96px; border-radius: 50%; overflow: hidden; background: linear-gradient(160deg, #a9c8ff, #f3b8d8); }
.call-avatar svg { width: 100%; height: 100%; display: block; }
.call-name { font-size: 30px; font-weight: 400; margin-top: 8px; }
.call-status { font-size: 16px; color: rgba(255,255,255,.7); font-variant-numeric: tabular-nums; }
.callscreen.live .call-avatar { width: 64px; height: 64px; }
.callscreen.live .call-name { font-size: 24px; margin-top: 2px; }
.call-box { width: 100%; max-width: 320px; margin-top: 28px; min-height: 92px; display: grid; place-items: center; padding: 16px 18px; border-radius: 18px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.16); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); text-align: center; }
.call-box p { margin: 0; font-size: 17px; line-height: 1.5; text-wrap: balance; transition: opacity .25s; }
.call-box p.fade { opacity: 0; }
.call-bottom { width: 100%; max-width: 320px; margin-top: auto; }
.round { width: 72px; height: 72px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; }
.round svg { width: 34px; height: 34px; }
.round.red { background: #ff3b30; }
.round.red svg { transform: rotate(0deg); }
.round.green { background: #34c759; }
.ring-row { display: flex; justify-content: space-between; padding-inline: 12px; }
.rb { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 14px; color: rgba(255,255,255,.9); }
.round.green { animation: ringpulse 1.4s ease-in-out infinite; }
@keyframes ringpulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(52,199,89,.55); } 50% { box-shadow: 0 0 0 14px rgba(52,199,89,0); } }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.call-grid { display: grid; grid-template-columns: repeat(3, 1fr); row-gap: 22px; justify-items: center; }
.cg { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; color: rgba(255,255,255,.92); }
.cb { width: 76px; height: 76px; max-width: 100%; border-radius: 50%; background: rgba(255,255,255,.16); color: #fff; display: grid; place-items: center; }
.cb.on { background: #fff; color: #1c1c1e; }
.cb svg { width: 30px; height: 30px; }
.end-row { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 36px; }
#call-end.ready { animation: endpulse 1.2s ease-in-out infinite; }
@keyframes endpulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,59,48,.55); } 50% { box-shadow: 0 0 0 14px rgba(255,59,48,0); } }
.end-hint { font-size: 13px; color: rgba(255,255,255,.75); }
.save-btn { font-size: 12px; line-height: 1.3; text-align: right; max-width: 120px; color: var(--ink); background: var(--bubble-him); }
#gallery-screen, #reset-screen { z-index: 8; }
.btn.danger { background: #e5484d; color: #fff; }
.save-img { width: 54px; height: 54px; padding: 0; border: 1.5px solid rgba(255,255,255,.9); border-radius: 50%; cursor: pointer; flex: none;
  font-size: 12px; font-weight: 700; letter-spacing: -.02em; color: #fff;
  background: #7aa3d4;
  box-shadow: 0 2px 6px rgba(60,90,140,.2); transition: transform .15s; }
.save-img:hover { transform: scale(1.06); }
.save-img:active { transform: scale(.95); }
.logo-wrap { position: relative; z-index: 2; margin: 0; width: min(440px, 100%); }
.logo-img { width: 100%; height: auto; display: block; animation: bob 3.2s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-6px); } }
@media (prefers-reduced-motion: reduce) { .logo-img { animation: none; } }
.slot .ttl { font-size: 13px; line-height: 1.4; }
.slot.got { cursor: pointer; font: inherit; color: inherit; text-align: left; }
@media (hover: hover) { .slot.got:hover { background: color-mix(in srgb, var(--heart) 8%, var(--choice)); } }
.slot .replay { font-size: 12px; color: var(--heart); margin-top: auto; }

@media (prefers-reduced-motion: reduce) { .round, #call-end.ready, .shake { animation: none !important; } .pop, .toast, .typing i { animation: none; } .menu button { transition: none; } }
</style>

</head>
<body>
<div class="app">
  <header class="gutter">
    <div class="avatar" aria-hidden="true"></div>
    <div class="name">정모형</div>
    <div class="meter" aria-label="호감도">♥ <span id="score">0</span></div>
    <button class="save-img" id="save-home" type="button">저장하기</button>
  </header>
  <main id="chat" class="gutter" aria-live="polite"></main>
  <section id="choices" class="gutter"></section>

  <div class="overlay dim" id="end" hidden>
    <div class="card">
      <div class="label" id="end-label">ENDING</div>
      <h2 id="end-title"></h2>
      <div class="score" id="end-score"></div>
      <ul class="log" id="log"></ul>
      <div class="btns">
        <button type="button" class="btn ghost" id="to-title">타이틀로</button>
        <button type="button" class="btn" id="again">다시 하기</button>
      </div>
    </div>
  </div>

  <div class="callscreen" id="call" hidden>
    <div class="call-top">
      <div class="call-avatar" id="call-avatar" aria-hidden="true"></div>
      <div class="call-name">정모형</div>
      <div class="call-status" id="call-status">휴대전화</div>
    </div>
    <div class="call-box" id="call-box" hidden aria-live="polite"><p id="call-line"></p></div>
    <div class="call-bottom">
      <div id="call-ring" class="ring-row">
        <div class="rb">
          <button type="button" class="round red" id="call-decline" aria-label="거절"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M12 9c-2.3 0-4.5.4-6.6 1.2-.6.2-.9.8-.9 1.4v2.6c0 .5.4.9.9.9 1 0 2-.2 2.9-.5.4-.1.7-.5.7-.9V12a12 12 0 0 1 6 0v1.7c0 .4.3.8.7.9.9.3 1.9.5 2.9.5.5 0 .9-.4.9-.9v-2.6c0-.6-.3-1.2-.9-1.4A18 18 0 0 0 12 9z" transform="rotate(0 12 12)"/></svg></button>
          <span>거절</span>
        </div>
        <div class="rb">
          <button type="button" class="round green" id="call-accept" aria-label="응답"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg></button>
          <span>응답</span>
        </div>
      </div>
      <div id="call-live" hidden>
        <div class="call-grid">
          <div class="cg"><span class="cb"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11z"/><path d="M4 4l16 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>소리 끔</div>
          <div class="cg"><span class="cb"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor"><circle cx="6" cy="5" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="18" cy="5" r="2"/><circle cx="6" cy="11" r="2"/><circle cx="12" cy="11" r="2"/><circle cx="18" cy="11" r="2"/><circle cx="6" cy="17" r="2"/><circle cx="12" cy="17" r="2"/><circle cx="18" cy="17" r="2"/><circle cx="12" cy="22" r="1.6"/></g></svg></span>키패드</div>
          <div class="cg"><span class="cb"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 5V4L8 9z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg></span>스피커</div>

const KEY = "dugeun-endings";
function loadGot() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } }
let got = loadGot();
function saveGot(id) {
  if (!got.includes(id)) got.push(id);
  try { localStorage.setItem(KEY, JSON.stringify(got)); } catch {}
}

/* ===== 엔진 ===== */
const chat = document.getElementById("chat");
const choicesEl = document.getElementById("choices");
const scoreEl = document.getElementById("score");
const app = document.querySelector(".app");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let state, lastWho, runId = 0;

function reset() {
  runId++; skipping = false;
  state = { score: 0, flags: {}, log: [], clock: [22, 14] };
  lastWho = null;
  chat.innerHTML = "";
  scoreEl.textContent = "0";
  document.getElementById("end").hidden = true;
  document.getElementById("call").hidden = true;
  go("start");
}
let skipping = false;
const pending = new Set();
const sleep = ms => skipping ? Promise.resolve() : new Promise(r => {
  const o = { r }; o.t = setTimeout(() => { pending.delete(o); r(); }, reduce ? Math.min(ms, 150) : ms); pending.add(o);
});
function skipNow() {
  skipping = true;
  pending.forEach(o => { clearTimeout(o.t); o.r(); }); pending.clear();
  choicesEl.innerHTML = `<div class="waiting">…</div>`;
}
function showWaiting() {
  if (got.length && !skipping) {
    choicesEl.innerHTML = `<div class="skip-row"><div class="waiting">…</div><button type="button" class="skip-btn">선택지로 스킵 ▸▸</button></div>`;
    choicesEl.querySelector(".skip-btn").addEventListener("click", skipNow);
  } else choicesEl.innerHTML = `<div class="waiting">…</div>`;
}
function stamp() {
  let [h, m] = state.clock;
  m += 1; if (m >= 60) { m -= 60; h = (h + 1) % 24; }
  state.clock = [h, m];
  return `${h < 12 ? "오전" : "오후"} ${h % 12 === 0 ? 12 : h % 12}:${String(m).padStart(2, "0")}`;
}
const scrollDown = () => { chat.scrollTop = chat.scrollHeight; };
function avatarEl() { const a = document.createElement("div"); a.className = "avatar"; a.setAttribute("aria-hidden", "true"); a.innerHTML = AVATAR_SVG; return a; }

function addBubble(who, text) {
  const row = document.createElement("div");
  row.className = `row ${who} pop`;
  const b = document.createElement("div"); b.className = "bubble"; b.textContent = text;
  const t = document.createElement("span"); t.className = "time"; t.textContent = stamp();
  if (who === "me") row.append(t, b);
  else {
    const first = lastWho !== "him";
    const stack = document.createElement("div"); stack.className = "stack";
    if (first) { row.classList.add("first"); row.append(avatarEl()); stack.innerHTML = `<div class="sender">정모형</div>`; }
    const line = document.createElement("div"); line.className = "row"; line.append(b, t);
    stack.append(line); row.append(stack);
  }
  chat.append(row); lastWho = who; scrollDown();
}
function addLine(cls, text) {
  const d = document.createElement("div"); d.className = `${cls} pop`; d.textContent = text;
  chat.append(d); lastWho = null; scrollDown();
}

async function play(msgs, id) {
  for (const m of msgs || []) {
    if (id !== runId) return false;
    if (m.clock) state.clock = m.clock.slice();
    if (m.day) { addLine("day", m.day); await sleep(400); }
    else if (m.narr) { await sleep(300); addLine("narr", m.narr); await sleep(700); }
    else if (m.mono) { await sleep(500); addLine(m.quote ? "mono quote" : "mono", m.mono); await sleep(900 + m.mono.length * 25); }
    else if (m.call) { await sleep(600); if (!(await runCall(m.call, id))) return false; }
    else if (m.me) { await sleep(350); addBubble("me", m.me); await sleep(300); }
    else if (m.him) {
      const first = lastWho !== "him";
      const typing = document.createElement("div");
      typing.className = "row him typing" + (first ? " first" : "");
      if (first) typing.append(avatarEl());
      typing.insertAdjacentHTML("beforeend", `<div class="bubble"><i></i><i></i><i></i></div>`);
      chat.append(typing); scrollDown();
      await sleep(450 + Math.min(m.him.length * 35, 900));
      typing.remove();
      if (id !== runId) return false;
      addBubble("him", m.him);
      await sleep(200);
    }
  }
  return id === runId;
}

function toast(d) {
  if (!d) return;
  const t = document.createElement("div"); t.className = "toast";
  t.textContent = (d > 0 ? "♥ +" : "♡ ") + d;
  app.append(t); setTimeout(() => t.remove(), 1200);
}

async function go(key) {
  const id = runId;
  if (key === "END") return showEnd();
  if (key === "branchConfess") key = state.flags.confess ? "confess" : "afterMeal";
  const node = SCRIPT[key];
  showWaiting();
  if (!(await play(node.msgs, id))) return;
  renderChoices(key, id);
}

/* ===== 저장 / 이어하기 ===== */
const SAVE_KEY = "dugeun-save";
let snap = null;
function hasSave() { try { return !!localStorage.getItem(SAVE_KEY); } catch { return false; } }
function clearSave() { snap = null; try { localStorage.removeItem(SAVE_KEY); } catch {} }
function saveAndHome() {
  if (snap) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(snap)); } catch {} }
  showTitle();
}
function resumeGame() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch {}
  if (!s || !SCRIPT[s.key]) { startGame(); return; }
  titleEl.hidden = true; stopPetals();
  runId++;
  state = s.state; lastWho = s.lastWho;
  chat.innerHTML = s.html;
  scoreEl.textContent = state.score > 0 ? `+${state.score}` : String(state.score);
  document.getElementById("end").hidden = true;
  document.getElementById("call").hidden = true;
  renderChoices(s.key, runId);
}

function renderChoices(key, id) {
  skipping = false;
  const node = SCRIPT[key];
  snap = { key, state: JSON.parse(JSON.stringify(state)), html: chat.innerHTML, lastWho };
  choicesEl.innerHTML = `<div class="hint">답장 고르기</div>`;
  node.choices.forEach(c => {
    const txt = c.alt && state.flags[c.alt.flag] ? c.alt.text : c.text;
    const b = document.createElement("button");
    b.type = "button"; b.className = "choice" + (c.act ? " act" : ""); b.textContent = txt;
    b.addEventListener("click", () => pick(c, id, txt));
    choicesEl.append(b);
  });
  scrollDown();
}

async function pick(c, id, txt) {
  if (id !== runId) return;
  showWaiting();
  state.score = state.score + c.d;
  scoreEl.textContent = state.score > 0 ? `+${state.score}` : String(state.score);
  if (c.flag) state.flags[c.flag] = true;
  state.log.push([txt, c.d]);
  toast(c.d);
  if (!c.act) addBubble("me", txt); else addLine("narr", txt + ".");
  await sleep(500);
  if (!(await play(c.then, id))) return;
  await sleep(500);
  go(c.next);
}

/* ===== 전화 화면 ===== */
const callEl = document.getElementById("call");
function runCall(lines, id) {
  return new Promise(resolve => {
    const status = document.getElementById("call-status");
    const box = document.getElementById("call-box");
    const line = document.getElementById("call-line");
    const ring = document.getElementById("call-ring");
    const live = document.getElementById("call-live");
    const endBtn = document.getElementById("call-end");
    const hint = document.getElementById("end-hint");
    const decline = document.getElementById("call-decline");
    status.textContent = "휴대전화";
    line.textContent = ""; box.hidden = true;
    ring.hidden = false; live.hidden = true;
    callEl.classList.remove("live");
    endBtn.classList.remove("ready"); hint.hidden = true; endBtn.onclick = null;
    callEl.hidden = false;
    decline.onclick = () => { decline.classList.remove("shake"); void decline.offsetWidth; decline.classList.add("shake"); };
    const acceptBtn = document.getElementById("call-accept");
    acceptBtn.onclick = async () => {
      acceptBtn.onclick = null; decline.onclick = null;
      ring.hidden = true; live.hidden = false; box.hidden = false;
      callEl.classList.add("live");
      let sec = 0, done = false;
      const fmt = s => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
      status.textContent = "00:00";
      const timer = setInterval(() => { sec++; status.textContent = fmt(sec); }, 1000);
      const finish = () => {
        if (done) return; done = true;
        clearInterval(timer);
        status.textContent = "통화 종료";
        endBtn.classList.remove("ready"); hint.hidden = true;
        setTimeout(() => {
          callEl.hidden = true;
          if (id === runId) addLine("narr", `통화 종료 · ${Math.floor(sec / 60)}분 ${sec % 60}초`);
          resolve(id === runId);
        }, skipping ? 0 : 900);
      };
      for (const l of lines) {
        if (id !== runId) { clearInterval(timer); callEl.hidden = true; return resolve(false); }
        if (line.textContent) {
          line.classList.add("fade");
          await sleep(320);
        }
        line.textContent = l;
        void line.offsetWidth;
        line.classList.remove("fade");
        await sleep(1300 + l.length * 50);
      }
      await sleep(1200);
      if (id !== runId) { clearInterval(timer); callEl.hidden = true; return resolve(false); }
      finish();
    };
    if (skipping) acceptBtn.onclick();
  });
}

async function showEnd() {
  const id = runId;
  const e = endingFor(state.score);
  skipping = false;
  choicesEl.innerHTML = `<div class="waiting">…</div>`;
  await sleep(900);
  addLine("day", "ENDING");
  if (!(await play(e.seq, id))) return;
  saveGot(e.id);
  clearSave();
  choicesEl.innerHTML = `<div class="waiting">이야기가 끝났어요</div>`;
  document.getElementById("end-label").textContent = `ENDING ${e.id}`;
  document.getElementById("end-title").textContent = `<${e.title}>`;
  document.getElementById("end-score").textContent = `최종 호감도 ♥ ${state.score}`;
  document.getElementById("end-score").hidden = false;
  document.getElementById("log").hidden = false;
  const log = document.getElementById("log"); log.innerHTML = "";
  state.log.forEach(([t, d]) => {
    const li = document.createElement("li");
    const a = document.createElement("span"); a.textContent = t;
    const b = document.createElement("span"); b.textContent = d > 0 ? `+${d}` : d === 0 ? "±0" : `${d}`;
    li.append(a, b); log.append(li);
  });
  setTimeout(() => { document.getElementById("end").hidden = false; }, 700);
}

/* ===== 화면 전환 ===== */
const titleEl = document.getElementById("title");
function refreshMenu() { document.getElementById("btn-continue").hidden = !hasSave(); }
function showTitle() { runId++; skipping = false; document.getElementById("end").hidden = true; document.getElementById("call").hidden = true; refreshMenu(); titleEl.hidden = false; startPetals(); }
async function replayEnding(e) {
  document.getElementById("gallery-screen").hidden = true;
  titleEl.hidden = true; stopPetals();
  runId++; skipping = false; snap = null;
  const id = runId;
  state = { score: 0, flags: {}, log: [], clock: [22, 14] };
  lastWho = null; chat.innerHTML = "";
  scoreEl.textContent = "–";
  document.getElementById("end").hidden = true;
  document.getElementById("call").hidden = true;
  choicesEl.innerHTML = `<div class="waiting">…</div>`;
  await sleep(500);
  addLine("day", "ENDING");
  if (!(await play(e.seq, id))) return;
  choicesEl.innerHTML = `<div class="waiting">이야기가 끝났어요</div>`;
  document.getElementById("end-label").textContent = `ENDING ${e.id}`;
  document.getElementById("end-title").textContent = `<${e.title}>`;
  document.getElementById("end-score").hidden = true;
  document.getElementById("log").hidden = true;
  setTimeout(() => { if (id === runId) document.getElementById("end").hidden = false; }, 700);
}
function startGame() { titleEl.hidden = true; stopPetals(); snap = null; reset(); }
function openGallery() {
  const g = document.getElementById("gallery"); g.innerHTML = "";
  ENDINGS.forEach(e => {
    const has = got.includes(e.id);
    const s = document.createElement(has ? "button" : "div");
    s.className = "slot " + (has ? "got" : "locked");
    if (has) { s.type = "button"; s.addEventListener("click", () => replayEnding(e)); }
    s.innerHTML = has
      ? `<span class="tag">♥ 획득</span><b>${e.name}</b><span class="ttl">&lt;${e.title}&gt;</span><small>${e.range}</small><span class="replay">▶ 다시 보기</span>`
      : `<span class="tag" style="color:var(--ink-soft)">미획득</span><b>???</b><small>${e.range}</small>`;
    g.append(s);
  });
  document.getElementById("count").textContent = `${got.length} / ${ENDINGS.length} 엔딩 수집`;
  document.getElementById("gallery-screen").hidden = false;
}
document.getElementById("btn-start").addEventListener("click", startGame);
document.getElementById("btn-gallery").addEventListener("click", openGallery);
document.getElementById("gallery-close").addEventListener("click", () => { document.getElementById("gallery-screen").hidden = true; });
document.getElementById("save-home").addEventListener("click", saveAndHome);
document.getElementById("btn-continue").addEventListener("click", resumeGame);
refreshMenu();
const resetScreen = document.getElementById("reset-screen");
document.getElementById("btn-reset").addEventListener("click", () => {
  document.getElementById("reset-msg").textContent = "저장된 진행 상황과 모은 엔딩이 모두 지워져요. 되돌릴 수 없어요.";
  document.getElementById("reset-btns").hidden = false;
  resetScreen.hidden = false;
});
document.getElementById("reset-cancel").addEventListener("click", () => { resetScreen.hidden = true; });
document.getElementById("reset-ok").addEventListener("click", () => {
  clearSave();
  got = [];
  try { localStorage.removeItem(KEY); } catch {}
  refreshMenu();
  document.getElementById("reset-msg").textContent = "초기화했어요. 처음부터 다시 시작할 수 있어요.";
  document.getElementById("reset-btns").hidden = true;
  setTimeout(() => { resetScreen.hidden = true; }, 1200);
});
document.getElementById("again").addEventListener("click", reset);
document.getElementById("to-title").addEventListener("click", showTitle);

/* ===== 벚꽃잎 ===== */
const cv = document.getElementById("petals"), ctx = cv.getContext("2d");
let petals = [], raf = null;
function sizeCanvas() {
  const r = cv.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = r.width * dpr; cv.height = r.height * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function seed() {
  const w = cv.clientWidth, h = cv.clientHeight;
  petals = Array.from({ length: 22 }, () => ({ x: Math.random() * w, y: Math.random() * h, s: 5 + Math.random() * 7, vy: .4 + Math.random() * .8, vx: -.3 + Math.random() * .8, r: Math.random() * 6, vr: -.02 + Math.random() * .04, a: .5 + Math.random() * .45 }));
}
function draw() {
  const w = cv.clientWidth, h = cv.clientHeight;
  ctx.clearRect(0, 0, w, h);
  petals.forEach(p => {
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.globalAlpha = p.a;
    ctx.fillStyle = "#ffc3dc";
    ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s * .55, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  });
}
function tick() {
  const w = cv.clientWidth, h = cv.clientHeight;
  petals.forEach(p => { p.y += p.vy; p.x += p.vx + Math.sin(p.y / 40) * .3; p.r += p.vr; if (p.y > h + 12) { p.y = -12; p.x = Math.random() * w; } });
  draw(); raf = requestAnimationFrame(tick);
}
function startPetals() { sizeCanvas(); seed(); if (reduce) draw(); else if (!raf) tick(); }
function stopPetals() { if (raf) cancelAnimationFrame(raf); raf = null; }
addEventListener("resize", () => { if (!titleEl.hidden) { sizeCanvas(); draw(); } });
startPetals();
</script>
